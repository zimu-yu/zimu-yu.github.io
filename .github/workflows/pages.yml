name: Check website changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated pages
        run: |
          test -s _site/index.html
          test -s _site/cv/index.html
          test -s _site/assets/files/Zimu_Yu_CV.pdf
          test -s _site/assets/images/Zimu_Yu.png
          test -s _site/research/index.html
          test -s _site/publications/index.html
          test -s _site/resources/index.html
          test -s _site/sitemap.xml
          test -s _site/robots.txt
